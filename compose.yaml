services:
  postgres:
    image: postgres:16
    container_name: retailspg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - retailspg-data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval : 5s
      timeout : 5s
      retries : 12

  etl:
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: . 
      dockerfile: docker/etl.Dockerfile
    secrets : 
      - database_url
    volumes :
      - ./data:/app/data
    profiles : ["etl"]

secrets:
  database_url:
    file: ./secrets/database_url.txt
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  retailspg-data:
    external: true
