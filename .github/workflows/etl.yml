name: ETL smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash       

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ vars.CI_DB_USER || 'ci' }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci_password' }}
          POSTGRES_DB: ${{ vars.CI_DB_NAME || 'retail' }}
        ports:
          - ${{ vars.CI_DB_PORT || '5432' }}:5432
        options: >-
          --health-cmd "pg_isready -U ${{ vars.CI_DB_USER || 'ci' }} -d ${{ vars.CI_DB_NAME || 'retail' }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: ${{ vars.CI_DB_PORT || '5432' }}
      PGUSER: ${{ vars.CI_DB_USER || 'ci' }}
      PGPASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci_password' }}
      PGDATABASE: ${{ vars.CI_DB_NAME || 'retail' }}
      PSQL: psql -v ON_ERROR_STOP=1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Load schema
        run: $PSQL -f data/schema.sql

      - name: Load CSV data
        run: |
          for t in dim_date dim_product dim_customer dim_store fact_sales; do
            $PSQL -c "\copy public.$t FROM 'data/$t.csv' WITH (FORMAT csv, HEADER true)"
          done

      - name: Install rules and ETL functions
        run: |
          for f in rules extract transform load pipeline; do
            $PSQL -f "etl/$f.sql"
          done

      - name: Run extract
        run: $PSQL -c "SELECT etl.extract();"

      - name: Load raw_sales
        run: |
          cut -d, -f1,11 data/fact_sales.csv | $PSQL -c "\copy staging.raw_sales (sale_id, category) FROM STDIN WITH (FORMAT csv, HEADER true)"

      - name: Run pipeline
        run: $PSQL -c "SELECT etl.run_pipeline();"

      - name: Run assertions
        run: $PSQL -f tests/assertion.sql