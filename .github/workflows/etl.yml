name: ETL reload

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: etl-retail
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    env:
      DATABASE_URL: ${{ secrets.URL }}
      PSQL: psql -v ON_ERROR_STOP=1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        
      - name: Rebuild source tables from CSV
        run: |
          $PSQL "$DATABASE_URL" -1 <<'SQL'
          DROP TABLE IF EXISTS public.fact_sales, public.dim_date, public.dim_product,
                               public.dim_customer, public.dim_store;
          \i data/schema.sql
          \copy public.dim_date (date_key, full_date, day_of_week, month_name, quarter, is_weekend) FROM 'data/dim_date.csv' WITH (FORMAT csv, HEADER true)
          \copy public.dim_product (product_key, product_name, category, subcategory, unit_cost, list_price) FROM 'data/dim_product.csv' WITH (FORMAT csv, HEADER true)
          \copy public.dim_customer (customer_key, customer_name, email, city, country, segment) FROM 'data/dim_customer.csv' WITH (FORMAT csv, HEADER true)
          \copy public.dim_store (store_key, store_name, region, store_type) FROM 'data/dim_store.csv' WITH (FORMAT csv, HEADER true)
          \copy public.fact_sales (sale_id, date_key, product_key, customer_key, store_key, sold_at, quantity, unit_price, discount_pct, revenue, category) FROM 'data/fact_sales.csv' WITH (FORMAT csv, HEADER true)
          SQL

      - name: Install rules and ETL functions
        run: |
          for f in rules extract transform load pipeline; do
            $PSQL "$DATABASE_URL" -f "etl/$f.sql"
          done

      - name: Run extract
        run: $PSQL "$DATABASE_URL" -c "SELECT etl.extract();"

      - name: Load raw_sales
        run: |
          cut -d, -f1,11 data/fact_sales.csv | $PSQL "$DATABASE_URL" -c "\copy staging.raw_sales (sale_id, category) FROM STDIN WITH (FORMAT csv, HEADER true)"

      - name: Run pipeline
        run: $PSQL "$DATABASE_URL" -c "SELECT etl.run_pipeline();"

      - name: Run date_dim_test
        run: $PSQL "$DATABASE_URL" -f tests/date_dimension_test.sql

      - name: Run assertion
        run: $PSQL "$DATABASE_URL" -f tests/assertion.sql